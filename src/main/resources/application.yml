# =====================================================================
# BAESL 脚手架 · 公共配置（所有环境共享，不要写环境敏感信息）
# 环境差异化配置见 application-{dev,test,prod}.yml
#
# 激活方式优先级（从高到低）：
#   1. JVM 参数：   java -jar dam-server.jar -Dspring.profiles.active=prod
#   2. 环境变量：   SPRING_PROFILES_ACTIVE=prod
#   3. 默认值：     dev（通过 spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}）
# =====================================================================

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: dam-server

  # ========== 公共：Jackson 序列化 ==========
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

# ========== MyBatis Plus 公共配置 ==========
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: org.dam.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# ========== Knife4j 公共配置（默认关闭，各环境按需覆盖） ==========
knife4j:
  enable: false
  setting:
    language: zh_cn
    enable-version: true
    enable-swagger-models: true

# ========== SpringDoc OpenAPI 公共配置 ==========
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: default
      paths-to-match: /**
      packages-to-scan: org.dam.controller

# ========== JWT 双 Token 公共配置（密钥通过 ${JWT_SECRET} 覆盖，prod 严禁写死） ==========
jwt:
  secret: ${JWT_SECRET:dam-rbac-jwt-secret-key-2026-change-me-in-production-environment}
  issuer: dam-rbac
  access-token-expire-minutes: 120
  refresh-token-expire-days: 7

# ========== 日志框架（logback-spring.xml 负责具体滚动策略，这里只控制包级别） ==========
logging:
  level:
    root: INFO
    org.dam: INFO
    org.springframework.web: INFO
    com.baomidou.mybatisplus: WARN
