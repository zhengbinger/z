  <rect class="moduleRect focus" x="40" y="228" width="320" height="74" rx="10" />
  <text class="moduleTitle focus" x="200" y="252" text-anchor="middle">UserStatusChangePublisher</text>
  <text class="moduleCaption focus" x="200" y="272" text-anchor="middle">主题 / 被观察者</text>
  <text class="moduleCaption focus" x="200" y="290" text-anchor="middle">持有 List&lt;Observer&gt; · 按 toStatus 路由</text>

