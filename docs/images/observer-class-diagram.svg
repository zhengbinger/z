<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 580" width="100%" height="auto" role="img" aria-label="Observer pattern class diagram">
  <style>
    .surface { fill: #F7F7F8; }
    .surface-muted { fill: #EFEFF2; }
    .text { fill: #171717; }
    .text-muted { fill: #52525B; }
    .border { stroke: rgba(23, 23, 23, 0.12); }
    .brand { stroke: #4B3FE3; }
    .brand-soft { fill: #F2F7FF; }
    .brand-text { fill: #1A1759; }
    .accent { stroke: #27D2BF; }
    .accent-text { fill: #0F766E; }

    .moduleRect { fill: #F7F7F8; stroke: rgba(23, 23, 23, 0.11); stroke-width: 1; }
    .moduleRect.focus { fill: #F2F7FF; stroke: #4B3FE3; stroke-width: 1.4; }
    .moduleRect.enum { fill: #EAFBF8; stroke: #27D2BF; stroke-width: 1.2; }
    .moduleRect.boundary { fill: rgba(247, 247, 248, 0.7); stroke: rgba(82, 82, 91, 0.32); stroke-width: 1; stroke-dasharray: 6 5; }

    .moduleTitle { fill: #171717; font: 500 14px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
    .moduleTitle.focus { fill: #1A1759; }
    .moduleTitle.enum { fill: #0F766E; }
    .moduleCaption { fill: #52525B; font: 400 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
    .moduleCaption.focus { fill: #4B3FE3; }
    .moduleCaption.enum { fill: #0F766E; }

    .connectorPath { fill: none; stroke: rgba(82, 82, 91, 0.6); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .connectorPath.primary { stroke: #4B3FE3; stroke-width: 1.7; stroke-dasharray: 7 6; }
    .connectorPath.implements { stroke-dasharray: 4 5; opacity: 0.78; }

    .arrowHead { fill: rgba(82, 82, 91, 0.72); }
    .arrowHead.primary { fill: #4B3FE3; }

    .labelBg { fill: #F7F7F8; stroke: rgba(23, 23, 23, 0.09); }
    .labelBg.primary { fill: #F2F7FF; stroke: rgba(75, 63, 227, 0.42); }
    .labelText { fill: #171717; font: 500 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
    .labelText.primary { fill: #1A1759; }
  </style>

  <defs>
    <marker id="archiArrowAuto" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowHead" d="M1 1 L7 4 L1 7 Z" />
    </marker>
    <marker id="archiArrowPrimary" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowHead primary" d="M1 1 L7 4 L1 7 Z" />
    </marker>
  </defs>

  <rect class="surface-muted" x="0" y="0" width="720" height="580" />

  <rect class="moduleRect boundary" x="40" y="36" width="640" height="372" rx="14" />
  <text class="moduleCaption" x="56" y="56">核心组件 · org.dam.component.status</text>

  <rect class="moduleRect boundary" x="40" y="424" width="640" height="124" rx="14" />
  <text class="moduleCaption" x="56" y="444">观察者实现 · org.dam.component.status.impl</text>

  <rect class="moduleRect" x="290" y="72" width="140" height="46" rx="8" />
  <text class="moduleTitle" x="360" y="92" text-anchor="middle">UserController</text>
  <text class="moduleCaption" x="360" y="108" text-anchor="middle">HTTP 入口</text>

  <rect class="moduleRect" x="280" y="148" width="160" height="46" rx="8" />
  <text class="moduleTitle" x="360" y="168" text-anchor="middle">UserServiceImpl</text>
