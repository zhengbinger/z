  <rect class="labelBg" x="332" y="226" width="60" height="20" rx="6" />
  <text class="labelText" x="362" y="240" text-anchor="middle">creates</text>

  <path class="connectorPath" d="M200 302 V334" marker-end="url(#archiArrowAuto)" />
  <rect class="labelBg" x="214" y="306" width="60" height="20" rx="6" />
  <text class="labelText" x="244" y="320" text-anchor="middle">holds</text>

  <path class="connectorPath implements" d="M200 384 V422" marker-end="url(#archiArrowAuto)" />
  <rect class="labelBg" x="214" y="394" width="80" height="20" rx="6" />
  <text class="labelText" x="254" y="408" text-anchor="middle">implements</text>

  <rect class="moduleRect" x="56" y="460" width="140" height="70" rx="8" />
  <text class="moduleTitle" x="126" y="484" text-anchor="middle">EnabledHandler</text>
  <text class="moduleCaption" x="126" y="500" text-anchor="middle">targetStatus=</text>
  <text class="moduleCaption" x="126" y="516" text-anchor="middle">ENABLED</text>

