  <path class="connectorPath primary" d="M360 194 V222" marker-end="url(#archiArrowPrimary)" />
  <rect class="labelBg primary" x="372" y="200" width="56" height="20" rx="6" />
  <text class="labelText primary" x="400" y="214" text-anchor="middle">publish()</text>

