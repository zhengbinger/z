  <text class="moduleCaption" x="282" y="500" text-anchor="middle">targetStatus=</text>
  <text class="moduleCaption" x="282" y="516" text-anchor="middle">DISABLED</text>

  <rect class="moduleRect" x="368" y="460" width="140" height="70" rx="8" />
  <text class="moduleTitle" x="438" y="484" text-anchor="middle">LockedHandler</text>
  <text class="moduleCaption" x="438" y="500" text-anchor="middle">targetStatus=</text>
  <text class="moduleCaption" x="438" y="516" text-anchor="middle">LOCKED</text>

  <rect class="moduleRect" x="524" y="460" width="140" height="70" rx="8" />
  <text class="moduleTitle" x="594" y="484" text-anchor="middle">PendingHandler</text>
  <text class="moduleCaption" x="594" y="500" text-anchor="middle">targetStatus=</text>
  <text class="moduleCaption" x="594" y="516" text-anchor="middle">PENDING</text>
