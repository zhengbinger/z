<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" width="100%" height="auto" role="img" aria-label="Sequence diagram for user status change">
  <style>
    .surface-muted { fill: #EFEFF2; }
    .text { fill: #171717; }
    .text-muted { fill: #52525B; }

    .participantBox { fill: #F7F7F8; stroke: rgba(23, 23, 23, 0.11); stroke-width: 1; }
    .participantBox.focus { fill: #F2F7FF; stroke: #4B3FE3; }
    .participantBox.external { stroke: rgba(82, 82, 91, 0.42); }
    .participantLabel { fill: #171717; font: 500 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
    .participantLabel.focus { fill: #1A1759; }
    .participantCaption { fill: #52525B; font: 400 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }

    .lifeline { fill: none; stroke: rgba(82, 82, 91, 0.42); stroke-width: 1.2; stroke-dasharray: 5 7; stroke-linecap: round; }
    .activation { fill: #F7F7F8; stroke: rgba(23, 23, 23, 0.11); stroke-width: 1; }
    .activation.focus { fill: #F2F7FF; stroke: #4B3FE3; }

    .messagePath { fill: none; stroke: #52525B; stroke-width: 1.5; }
    .messagePath.return { stroke-dasharray: 7 6; }
    .messagePath.focus { stroke: #4B3FE3; stroke-width: 1.8; }

    .arrowHead { fill: #52525B; }
    .arrowHead.focus { fill: #4B3FE3; }

    .labelBg { fill: #F7F7F8; stroke: rgba(23, 23, 23, 0.09); }
    .labelBg.focus { fill: #F2F7FF; stroke: rgba(75, 63, 227, 0.42); }
    .messageLabel { fill: #171717; font: 500 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
    .messageLabel.focus { fill: #1A1759; }

    .phaseChip { fill: rgba(247, 247, 248, 0.56); stroke: rgba(23, 23, 23, 0.08); }
    .phaseText { fill: #52525B; font: 500 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
  </style>

  <defs>
    <marker id="seqArrowAuto" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowHead" d="M1 1 L7 4 L1 7 Z" />
    </marker>
    <marker id="seqArrowFocus" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowHead focus" d="M1 1 L7 4 L1 7 Z" />
    </marker>
  </defs>

  <rect class="surface-muted" x="0" y="0" width="720" height="470" />

  <rect class="phaseChip" x="40" y="20" width="180" height="26" rx="13" />
  <text class="phaseText" x="130" y="38" text-anchor="middle">阶段一 · 状态持久化</text>
  <rect class="phaseChip" x="500" y="20" width="180" height="26" rx="13" />
  <text class="phaseText" x="590" y="38" text-anchor="middle">阶段二 · 事件分发</text>

  <g transform="translate(40 60)">
    <rect class="participantBox external" width="120" height="50" rx="8" />
    <text class="participantLabel" x="60" y="22" text-anchor="middle">Client</text>
    <text class="participantCaption" x="60" y="40" text-anchor="middle">HTTP 调用方</text>
  </g>
  <g transform="translate(190 60)">
    <rect class="participantBox" width="120" height="50" rx="8" />
    <text class="participantLabel" x="60" y="22" text-anchor="middle">UserController</text>
    <text class="participantCaption" x="60" y="40" text-anchor="middle">REST 入口</text>
  </g>
  <g transform="translate(340 60)">
    <rect class="participantBox" width="120" height="50" rx="8" />
    <text class="participantLabel" x="60" y="22" text-anchor="middle">UserServiceImpl</text>
    <text class="participantCaption" x="60" y="40" text-anchor="middle">业务事务</text>
  </g>
  <g transform="translate(490 60)">
    <rect class="participantBox focus" width="120" height="50" rx="8" />
    <text class="participantLabel focus" x="60" y="22" text-anchor="middle">Publisher</text>
    <text class="participantCaption" x="60" y="40" text-anchor="middle">主题 / 焦点</text>
  </g>
  <g transform="translate(610 60)">
    <rect class="participantBox" width="70" height="50" rx="8" />
    <text class="participantLabel" x="35" y="22" text-anchor="middle">Handler</text>
    <text class="participantCaption" x="35" y="40" text-anchor="middle">实现</text>
  </g>

  <path class="lifeline" d="M100 110 V440" />
  <path class="lifeline" d="M250 110 V440" />
  <path class="lifeline" d="M400 110 V440" />
  <path class="lifeline" d="M550 110 V440" />
  <path class="lifeline" d="M645 110 V440" />

  <rect class="activation" x="242" y="150" width="16" height="252" rx="5" />
  <rect class="activation" x="392" y="200" width="16" height="148" rx="5" />
  <rect class="activation focus" x="542" y="252" width="16" height="44" rx="5" />
  <rect class="activation" x="637" y="300" width="16" height="40" rx="5" />

  <path class="messagePath focus" d="M110 160 H242" marker-end="url(#seqArrowFocus)" />
  <rect class="labelBg focus" x="120" y="148" width="112" height="22" rx="6" />
  <text class="messageLabel focus" x="176" y="164" text-anchor="middle">PUT status=2</text>

  <path class="messagePath" d="M266 210 H392" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="282" y="198" width="100" height="22" rx="6" />
  <text class="messageLabel" x="332" y="214" text-anchor="middle">changeUserStatus</text>

  <path class="messagePath return" d="M392 244 H268" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="306" y="232" width="48" height="22" rx="6" />
  <text class="messageLabel" x="330" y="248" text-anchor="middle">ok</text>

  <path class="messagePath focus" d="M416 284 H542" marker-end="url(#seqArrowFocus)" />
  <rect class="labelBg focus" x="430" y="272" width="100" height="22" rx="6" />
  <text class="messageLabel focus" x="480" y="288" text-anchor="middle">publish(event)</text>

  <path class="messagePath focus" d="M566 312 H637" marker-end="url(#seqArrowFocus)" />
  <rect class="labelBg focus" x="555" y="300" width="94" height="22" rx="6" />
  <text class="messageLabel focus" x="602" y="316" text-anchor="middle">onStatusChange</text>

  <path class="messagePath return" d="M392 356 H110" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="200" y="344" width="84" height="22" rx="6" />
  <text class="messageLabel" x="242" y="360" text-anchor="middle">return true</text>
</svg>
