<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 660" width="100%" height="auto" role="img" aria-label="刷新流程时序图">
  <style>
    .surface-muted { fill: #EFEFF2; }
    .text { fill: #171717; }
    .text-muted { fill: #52525B; }

    .participantBox { fill: #F7F7F8; stroke: rgba(23, 23, 23, 0.11); stroke-width: 1; }
    .participantBox.focus { fill: #F2F7FF; stroke: #4B3FE3; }
    .participantBox.external { stroke: rgba(82, 82, 91, 0.42); }
    .participantLabel { fill: #171717; font: 500 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
    .participantLabel.focus { fill: #1A1759; }
    .participantCaption { fill: #52525B; font: 400 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }

    .lifeline { fill: none; stroke: rgba(82, 82, 91, 0.42); stroke-width: 1.2; stroke-dasharray: 5 7; stroke-linecap: round; }
    .activation { fill: #F7F7F8; stroke: rgba(23, 23, 23, 0.11); stroke-width: 1; }
    .activation.focus { fill: #F2F7FF; stroke: #4B3FE3; }

    .messagePath { fill: none; stroke: #52525B; stroke-width: 1.5; }
    .messagePath.return { stroke-dasharray: 7 6; }
    .messagePath.focus { stroke: #4B3FE3; stroke-width: 1.8; }

    .arrowHead { fill: #52525B; }
    .arrowHead.focus { fill: #4B3FE3; }

    .labelBg { fill: #F7F7F8; stroke: rgba(23, 23, 23, 0.09); }
    .labelBg.focus { fill: #F2F7FF; stroke: rgba(75, 63, 227, 0.42); }
    .messageLabel { fill: #171717; font: 500 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
    .messageLabel.focus { fill: #1A1759; }

    .phaseChip { fill: rgba(247, 247, 248, 0.56); stroke: rgba(23, 23, 23, 0.08); }
    .phaseText { fill: #52525B; font: 500 12px "SF Pro Text", "PingFang SC", system-ui, sans-serif; }
  </style>

  <defs>
    <marker id="seqArrowAuto" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowHead" d="M1 1 L7 4 L1 7 Z" />
    </marker>
    <marker id="seqArrowFocus" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowHead focus" d="M1 1 L7 4 L1 7 Z" />
    </marker>
  </defs>

  <rect class="surface-muted" x="0" y="0" width="830" height="660" />

  <rect class="phaseChip" x="40" y="20" width="190" height="26" rx="13" />
  <text class="phaseText" x="135" y="38" text-anchor="middle">阶段1 · 校验 refresh Token</text>
  <rect class="phaseChip" x="450" y="20" width="200" height="26" rx="13" />
  <text class="phaseText" x="550" y="38" text-anchor="middle">阶段2 · Lua CAS 原子轮转</text>

  <g transform="translate(20 60)">
    <rect class="participantBox external" width="100" height="50" rx="8" />
    <text class="participantLabel" x="50" y="22" text-anchor="middle">前端</text>
    <text class="participantCaption" x="50" y="40" text-anchor="middle">浏览器 / App</text>
  </g>
  <g transform="translate(140 60)">
    <rect class="participantBox" width="110" height="50" rx="8" />
    <text class="participantLabel" x="55" y="22" text-anchor="middle">AuthController</text>
    <text class="participantCaption" x="55" y="40" text-anchor="middle">REST 入口</text>
  </g>
  <g transform="translate(275 60)">
    <rect class="participantBox" width="120" height="50" rx="8" />
    <text class="participantLabel" x="60" y="22" text-anchor="middle">AuthServiceImpl</text>
    <text class="participantCaption" x="60" y="40" text-anchor="middle">业务事务</text>
  </g>
  <g transform="translate(420 60)">
    <rect class="participantBox" width="100" height="50" rx="8" />
    <text class="participantLabel" x="50" y="22" text-anchor="middle">JwtTokenUtil</text>
    <text class="participantCaption" x="50" y="40" text-anchor="middle">Token 签发 / 校验</text>
  </g>
  <g transform="translate(545 60)">
    <rect class="participantBox" width="90" height="50" rx="8" />
    <text class="participantLabel" x="45" y="22" text-anchor="middle">UserMapper</text>
    <text class="participantCaption" x="45" y="40" text-anchor="middle">用户主体查询</text>
  </g>
  <g transform="translate(655 60)">
    <rect class="participantBox focus" width="140" height="50" rx="8" />
    <text class="participantLabel focus" x="70" y="22" text-anchor="middle">RefreshTokenService</text>
    <text class="participantCaption" x="70" y="40" text-anchor="middle">Redis · 焦点</text>
  </g>

  <path class="lifeline" d="M70 110 V630" />
  <path class="lifeline" d="M195 110 V630" />
  <path class="lifeline" d="M335 110 V630" />
  <path class="lifeline" d="M470 110 V630" />
  <path class="lifeline" d="M590 110 V630" />
  <path class="lifeline" d="M725 110 V630" />

  <rect class="activation" x="187" y="160" width="16" height="475" rx="5" />
  <rect class="activation" x="327" y="205" width="16" height="395" rx="5" />
  <rect class="activation" x="462" y="245" width="16" height="50" rx="5" />
  <rect class="activation" x="462" y="405" width="16" height="20" rx="5" />
  <rect class="activation" x="582" y="325" width="16" height="50" rx="5" />
  <rect class="activation focus" x="717" y="445" width="16" height="105" rx="5" />

  <path class="messagePath focus" d="M80 165 H187" marker-end="url(#seqArrowFocus)" />
  <rect class="labelBg focus" x="68" y="153" width="130" height="22" rx="6" />
  <text class="messageLabel focus" x="133" y="169" text-anchor="middle">POST /auth/refresh</text>

  <path class="messagePath" d="M203 210 H327" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="200" y="198" width="130" height="22" rx="6" />
  <text class="messageLabel" x="265" y="214" text-anchor="middle">refresh(refreshDTO)</text>

  <path class="messagePath" d="M343 250 H462" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="320" y="238" width="165" height="22" rx="6" />
  <text class="messageLabel" x="402" y="254" text-anchor="middle">verifyToken (type=refresh)</text>

  <path class="messagePath return" d="M462 290 H343" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="337" y="278" width="130" height="22" rx="6" />
  <text class="messageLabel" x="402" y="294" text-anchor="middle">userId / username</text>

  <path class="messagePath" d="M343 330 H582" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="372" y="318" width="180" height="22" rx="6" />
  <text class="messageLabel" x="462" y="334" text-anchor="middle">selectById + checkUserLoginable</text>

  <path class="messagePath return" d="M582 370 H343" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="402" y="358" width="120" height="22" rx="6" />
  <text class="messageLabel" x="462" y="374" text-anchor="middle">User 可登录</text>

  <path class="messagePath focus" d="M343 410 H462" marker-end="url(#seqArrowFocus)" />
  <rect class="labelBg focus" x="305" y="398" width="195" height="22" rx="6" />
  <text class="messageLabel focus" x="402" y="414" text-anchor="middle">generateAccess + RefreshToken</text>

  <path class="messagePath focus" d="M343 450 H717" marker-end="url(#seqArrowFocus)" />
  <rect class="labelBg focus" x="430" y="438" width="200" height="22" rx="6" />
  <text class="messageLabel focus" x="530" y="454" text-anchor="middle">rotate(userId, old, new)</text>

  <path class="messagePath focus" d="M733 490 h40 v15 h-40" marker-end="url(#seqArrowFocus)" />
  <rect class="labelBg focus" x="693" y="466" width="120" height="22" rx="6" />
  <text class="messageLabel focus" x="753" y="482" text-anchor="middle">Lua CAS 原子轮转</text>

  <path class="messagePath return" d="M717 545 H343" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="475" y="533" width="110" height="22" rx="6" />
  <text class="messageLabel" x="530" y="549" text-anchor="middle">true / false</text>

  <path class="messagePath return" d="M327 585 H203" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="200" y="573" width="130" height="22" rx="6" />
  <text class="messageLabel" x="265" y="589" text-anchor="middle">TokenVO / 401</text>

  <path class="messagePath return" d="M187 625 H80" marker-end="url(#seqArrowAuto)" />
  <rect class="labelBg" x="76" y="613" width="115" height="22" rx="6" />
  <text class="messageLabel" x="133" y="629" text-anchor="middle">Result&lt;TokenVO&gt;</text>
</svg>
